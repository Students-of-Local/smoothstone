[project]
name = "smoothstone-lift"
version = "0.1.0"
description = "Local single-image to 3D mesh lift for smoothstone (Hunyuan3D-2mini shape on MPS)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "diffusers==0.35.2",
    "transformers==4.57.1",
    "accelerate==1.11.0",
    "huggingface-hub==0.36.0",
    "safetensors==0.6.2",
    "einops==0.8.1",
    "omegaconf==2.3.0",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "scikit-image==0.25.2",
    "trimesh==4.9.0",
    "pymeshlab==2025.7",
    "pillow==12.0.0",
    "rembg==2.0.67",
    "onnxruntime==1.23.2",
    "psutil==7.1.3",
    "matplotlib==3.10.7",
]

[tool.uv]
package = false
