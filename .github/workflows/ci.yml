name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends potrace xvfb libgl1 libegl1 libglu1-mesa libfontconfig1

      - name: OpenSCAD nightly AppImage
        run: |
          name=$(curl -fsSL https://files.openscad.org/snapshots/ \
            | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage' | sort -uV | tail -1)
          echo "Using $name"
          curl -fsSL -o openscad.AppImage "https://files.openscad.org/snapshots/$name"
          chmod +x openscad.AppImage
          mkdir -p "$RUNNER_TEMP/openscad"
          cd "$RUNNER_TEMP/openscad"
          "$GITHUB_WORKSPACE/openscad.AppImage" --appimage-extract > /dev/null
          echo "STONE_OPENSCAD=$RUNNER_TEMP/openscad/squashfs-root/AppRun" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/openscad/squashfs-root/AppRun" --version

      - uses: astral-sh/setup-uv@v6

      - name: Sync
        run: uv sync

      - name: Tests
        run: xvfb-run -a uv run pytest -q

      - name: Every recipe and example builds and passes the print checks
        run: xvfb-run -a uv run python tools/sheet.py all --out "$RUNNER_TEMP/sheet"

      - name: The NEXT lines alone finish every tuning task
        run: |
          mkdir -p "$RUNNER_TEMP/next"
          for s in evals/tuning/*.json; do
            xvfb-run -a uv run python evals/run.py "$s" --seed 1 --driver next --out "$RUNNER_TEMP/next" | tail -1
          done
          uv run python evals/summary.py "$RUNNER_TEMP/next" | tee "$RUNNER_TEMP/next.txt"
          ! grep -q "^t.* 0/1" "$RUNNER_TEMP/next.txt"
