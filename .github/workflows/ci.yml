name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The tests run on every core (pytest-xdist): one after another they passed 35 minutes
  # once the product recipes built every catalog product.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends potrace xvfb libgl1 libegl1 libglu1-mesa libfontconfig1

      - name: OpenSCAD nightly AppImage
        run: |
          name=$(curl -fsSL https://files.openscad.org/snapshots/ \
            | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage' | sort -uV | tail -1)
          echo "Using $name"
          curl -fsSL -o openscad.AppImage "https://files.openscad.org/snapshots/$name"
          chmod +x openscad.AppImage
          mkdir -p "$RUNNER_TEMP/openscad"
          cd "$RUNNER_TEMP/openscad"
          "$GITHUB_WORKSPACE/openscad.AppImage" --appimage-extract > /dev/null
          echo "STONE_OPENSCAD=$RUNNER_TEMP/openscad/squashfs-root/AppRun" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/openscad/squashfs-root/AppRun" --version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Sync
        run: uv sync

      - name: Tests
        run: xvfb-run -a uv run pytest -q -n auto -m "not timing"

      - name: Timing tests, alone
        run: xvfb-run -a uv run pytest -q -m timing

  # The sheet and the evals build every recipe through stone's checks, which
  # slice each part; together with the tests they ran past 60 minutes on one
  # runner, so they run in their own job beside the tests.
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends potrace xvfb libgl1 libegl1 libglu1-mesa libfontconfig1

      - name: OpenSCAD nightly AppImage
        run: |
          name=$(curl -fsSL https://files.openscad.org/snapshots/ \
            | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage' | sort -uV | tail -1)
          echo "Using $name"
          curl -fsSL -o openscad.AppImage "https://files.openscad.org/snapshots/$name"
          chmod +x openscad.AppImage
          mkdir -p "$RUNNER_TEMP/openscad"
          cd "$RUNNER_TEMP/openscad"
          "$GITHUB_WORKSPACE/openscad.AppImage" --appimage-extract > /dev/null
          echo "STONE_OPENSCAD=$RUNNER_TEMP/openscad/squashfs-root/AppRun" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/openscad/squashfs-root/AppRun" --version

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Sync
        run: uv sync

      - name: Every recipe and example builds and passes the print checks
        run: xvfb-run -a uv run python tools/sheet.py all --out "$RUNNER_TEMP/sheet"

      - name: The NEXT lines alone finish every tuning task
        run: |
          mkdir -p "$RUNNER_TEMP/next"
          for s in evals/tuning/*.json; do
            xvfb-run -a uv run python evals/run.py "$s" --seed 1 --driver next --out "$RUNNER_TEMP/next" | tail -1
          done
          uv run python evals/summary.py "$RUNNER_TEMP/next" | tee "$RUNNER_TEMP/next.txt"
          if grep -q "^t.* 0/1" "$RUNNER_TEMP/next.txt"; then echo "a tuning task failed"; exit 1; fi
          uv run python evals/ratchet.py "$RUNNER_TEMP/next"

      - name: The ratchet holds against main (no lowered floor or deleted spec without a LOG.md line)
        run: uv run python evals/ratchet.py --check-git origin/main
